name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          unzip -q Bus55Widget.zip
          cd Bus55Widget
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Bus55.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bus 55 widget (build ${{ github.run_number }})
          files: Bus55.apk
